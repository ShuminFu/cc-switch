# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Run locally from the repository root:
#   cargo deny --manifest-path src-tauri/Cargo.toml check
#
# CI runs the same check on every PR/push and on a weekly schedule, so a new
# RustSec advisory against a crate in Cargo.lock fails the build even when no
# code changed.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerabilities, unsound and yanked crates are errors. Unmaintained notices
# are only reported for crates we depend on directly; transitive ones are
# outside our control and would only add noise.
unmaintained = "workspace"
yanked = "deny"
# Accepted advisories. Only advisories that a semver-compatible `cargo update`
# cannot fix belong here (CCS-018 baseline, pruned in CCS-214). Every new entry
# needs a reason and a follow-up ticket.
ignore = [
    # zip 4.6.1, pulled in only by tauri-plugin-updater 2.10 (latest 2.x) and only
    # on Windows. Our direct zip dependency is on 9.x, which fixes all three
    # (CCS-215). The updater extracts a signature-verified bundle, and these
    # advisories concern Unix SUID bits and symlinks. Drop the entries once the
    # updater moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "transitive: zip 4.6.1 via tauri-plugin-updater (Windows only)" },
    { id = "RUSTSEC-2026-0368", reason = "transitive: zip 4.6.1 via tauri-plugin-updater (Windows only)" },
    { id = "RUSTSEC-2026-0369", reason = "transitive: zip 4.6.1 via tauri-plugin-updater (Windows only)" },
    # zstd 0.13 / zstd-safe 7 (direct dependency); fixed in zstd >= 0.14.3 /
    # zstd-safe >= 8.2.0, which is a breaking bump for us
    { id = "RUSTSEC-2026-0391", reason = "baseline: zstd 0.13, fix needs zstd 0.14.3 (breaking)" },
    { id = "RUSTSEC-2026-0398", reason = "baseline: zstd-safe 7, fix needs zstd-safe 8.2 (breaking)" },
    { id = "RUSTSEC-2026-0403", reason = "baseline: zstd-safe 7, fix needs zstd-safe 8.2 (breaking)" },
]

[licenses]
# The app is MIT; every dependency must use one of these permissive or
# weak-copyleft (file-level) licenses.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8
# Per-crate exceptions for licenses we accept for one crate only.
exceptions = [
    # Pure-Rust libbzip2 port behind zip 9's default bzip2 support (CCS-215).
    # bzip2-1.0.6 is the permissive BSD-style libbzip2 license.
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]

[bans]
# Duplicate versions are common in a Tauri graph; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
