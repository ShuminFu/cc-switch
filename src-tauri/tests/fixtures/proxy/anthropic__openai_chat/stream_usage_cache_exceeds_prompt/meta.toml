intent = "When cache counts exceed prompt_tokens the fresh input saturates at 0 instead of underflowing."
source_commit = "6330783"
ported_from = "src/proxy/providers/streaming.rs::tests::test_usage_chunk_clamps_input_to_zero_when_cache_exceeds_prompt"

[invariants]
skip = ["usage_conservation"]
skip_reason = "Upstream reports cache_read+cache_creation (130) > prompt_tokens (100); the bridge clamps fresh input to 0, so the sum cannot add back up."

[usage_parity]
expected_issue = "cache_exceeds_input"
reason = "The upstream's own usage block is inconsistent (cache 130 > prompt_tokens 100); the proxy logs it with the cache_exceeds_input flag."
