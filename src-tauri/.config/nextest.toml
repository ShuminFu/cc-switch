# cargo-nextest configuration (TEST-22).
#
# Local runs keep plain `cargo test`; CI uses `cargo nextest run --profile ci`.
# nextest runs every test in its own process, so process-global state
# (env vars, settings cache, HTTP client) cannot leak between tests, and a test
# that only passes on retry is reported as FLAKY instead of silently passing.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# Retry twice; a pass after a failure is reported as flaky in the summary
# and in the JUnit file.
retries = 2
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml.
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.nightly]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.nightly.junit]
path = "junit.xml"
