# Workspace for the Rust frontend crates. `src-tauri` stays a standalone
# package (its release profile, lockfile and `src-tauri/target` paths are
# referenced by the release pipeline) and depends on `cc-switch-contract`
# through a path dependency.
[workspace]
resolver = "2"
members = ["cc-switch-contract", "cc-switch-ui"]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
