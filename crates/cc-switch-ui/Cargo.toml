[package]
name = "cc-switch-ui"
version = "0.1.0"
description = "Dioxus frontend for cc-switch, rendered inside the Tauri webview"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cc-switch-contract = { path = "../cc-switch-contract" }
cc-switch-presets = { path = "../cc-switch-presets" }
dioxus = { version = "0.7", features = ["web"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Document", "Element", "DomTokenList", "MediaQueryList", "EventTarget"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

[dev-dependencies]
dioxus-ssr = "0.7"

[features]
default = ["web"]
web = ["dioxus/web"]
