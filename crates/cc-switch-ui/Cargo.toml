[package]
name = "cc-switch-ui"
version = "0.1.0"
description = "Dioxus frontend for cc-switch, rendered inside the Tauri webview"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cc-switch-contract = { path = "../cc-switch-contract" }
dioxus = { version = "0.7", features = ["web"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "DomTokenList", "MediaQueryList"] }

[features]
default = ["web"]
web = ["dioxus/web"]
