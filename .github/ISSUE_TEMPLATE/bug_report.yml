name: "🐛 Bug Report / Bug 报告"
description: |
  Report errors or unexpected behavior.
  报告错误或异常行为。
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Troubleshooting guide (logs, crash log, per-OS fixes) / 故障排查指南（日志、崩溃日志、各系统问题）:
        [English](https://github.com/farion1231/cc-switch/blob/main/docs/user-manual/en/5-faq/5.6-troubleshooting.md) ·
        [中文](https://github.com/farion1231/cc-switch/blob/main/docs/user-manual/zh/5-faq/5.6-troubleshooting.md) ·
        [日本語](https://github.com/farion1231/cc-switch/blob/main/docs/user-manual/ja/5-faq/5.6-troubleshooting.md)

  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have read the [FAQ](https://github.com/farion1231/cc-switch#faq) section in README.
            我已阅读 README 中的[常见问题](https://github.com/farion1231/cc-switch#常见问题)。
          required: true
        - label: |
            I have searched for [existing issues](https://github.com/farion1231/cc-switch/issues), including closed ones.
            我已搜索过[已有的 Issue](https://github.com/farion1231/cc-switch/issues)，包括已关闭的。
          required: true

  - type: input
    attributes:
      label: CC Switch Version / 版本号
      description: |
        Settings → About. Please check the [latest release](https://github.com/farion1231/cc-switch/releases/latest) first.
        在 设置 → 关于 中查看。请先确认是否为[最新版本](https://github.com/farion1231/cc-switch/releases/latest)。
      placeholder: "e.g. 3.17.0"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating System / 操作系统
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    attributes:
      label: OS Version / 系统版本
      description: |
        e.g. Windows 11 24H2, macOS 15.4, Ubuntu 24.04 (GNOME, Wayland)
        例如 Windows 11 24H2、macOS 15.4、Ubuntu 24.04（GNOME，Wayland）
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Architecture / 架构
      multiple: false
      options:
        - x64 / Intel
        - ARM64 (Windows on ARM, Linux ARM64)
        - Apple Silicon (M1/M2/M3/M4)
        - Not sure / 不确定
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Installation Method / 安装方式
      description: |
        Updates and some behaviour differ per package (the in-app updater handles MSI, macOS and AppImage).
        不同安装包行为有差异（应用内更新支持 MSI、macOS 与 AppImage）。
      multiple: false
      options:
        - Windows MSI installer
        - Windows portable zip
        - macOS DMG / zip
        - Homebrew
        - Linux AppImage
        - Linux .deb
        - Linux .rpm
        - AUR (cc-switch-bin)
        - Flatpak (self-built)
        - Built from source / 源码构建
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    attributes:
      label: App Language / 界面语言
      multiple: false
      options:
        - English
        - 简体中文
        - 繁體中文
        - 日本語
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Related App / 涉及应用
      description: |
        Which app is affected?
        涉及哪个应用？
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Gemini CLI
        - Grok Build
        - OpenCode
        - OpenClaw
        - Hermes Agent
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Feature Area / 功能模块
      multiple: true
      options:
        - Providers / switching / 供应商与切换
        - Proxy / takeover / failover / 代理、接管与故障转移
        - Usage & cost / 用量与成本
        - MCP
        - Prompts / 提示词
        - Skills
        - Sessions / 会话
        - Projects / 项目
        - Cloud sync / backup / 云同步与备份
        - Deep links / 深度链接
        - Tray / window / 托盘与窗口
        - Install / update / 安装与更新
        - Other / 其他
    validations:
      required: false

  - type: textarea
    attributes:
      label: Steps to Reproduce / 重现步骤
      description: |
        Please describe the steps to reproduce the bug.
        请描述重现步骤。
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior / 期望行为
      description: |
        What did you expect to happen?
        你期望发生什么？
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior / 实际行为
      description: |
        What actually happened? Include the exact error message if there is one.
        实际发生了什么？如有报错，请附上完整的错误信息。
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Secrets / 敏感信息
      options:
        - label: |
            I removed API keys, tokens and private base URLs from the logs, config files and screenshots below.
            我已从下面的日志、配置文件和截图中删除了 API 密钥、令牌和私有地址。
          required: true

  - type: textarea
    attributes:
      label: Log Excerpt / 日志片段
      description: |
        App log: `~/.cc-switch/logs/cc-switch.log` (Windows: `%USERPROFILE%\.cc-switch\logs\`). After a crash also attach `~/.cc-switch/crash.log`.
        Provider configs, `settings.json`, `auth.json`, `.env`, proxy and debug logs can contain API keys: remove them first.
        应用日志：`~/.cc-switch/logs/cc-switch.log`（Windows：`%USERPROFILE%\.cc-switch\logs\`）。崩溃时请同时附上 `~/.cc-switch/crash.log`。
        供应商配置、`settings.json`、`auth.json`、`.env`、代理日志与 debug 日志可能包含 API 密钥，请先删除。
      render: text
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context / 补充信息
      description: |
        Screenshots or anything else (hide API keys in screenshots).
        截图或其他信息（截图中请遮挡 API 密钥）。
    validations:
      required: false
