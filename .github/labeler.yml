# Configuration for actions/labeler v5
# Automatically labels PRs based on changed file paths.
#
# Prefer directory/wildcard globs over single file names so the rules do not
# rot when files move. `pnpm check:repo` (scripts/check-repo.mjs) fails CI when
# a glob below no longer matches any tracked file (CI-31).

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "src/index.html"
          - "vite.config.ts"
          - "vitest.config.ts"
          - "tailwind.config.cjs"
          - "postcss.config.cjs"
          - "tsconfig.json"
          - "tsconfig.node.json"
          - "components.json"
          - "tests/**"
          - "eslint.config.js"
          - ".node-version"
          - "scripts/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src-tauri/**"
          - "rust-toolchain.toml"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "src/i18n/locales/**"
          - "scripts/check-i18n.mjs"

actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "src-tauri/Cargo.toml"
          - "src-tauri/Cargo.lock"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"
          - "LICENSE"

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/mcp/**"
          - "src/lib/api/mcp.ts"
          - "src-tauri/src/mcp/**"
          - "src-tauri/src/*_mcp.rs"
          - "src-tauri/src/commands/mcp.rs"
          - "src-tauri/src/services/mcp.rs"

skills:
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/skills/**"
          - "src/lib/api/skills.ts"
          - "src-tauri/src/commands/skill*.rs"
          - "src-tauri/src/services/skill*.rs"
          - "src-tauri/src/database/dao/skill*.rs"

proxy:
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/proxy/**"
          - "src/lib/api/proxy.ts"
          - "src-tauri/src/proxy/**"
          - "src-tauri/src/commands/proxy.rs"
