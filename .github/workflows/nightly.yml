name: Nightly

# TEST-22: slow and network-dependent tests that do not belong on every PR.
#
# - property tests with a high case count (PROPTEST_CASES),
# - the `#[ignore]` live S3 round-trips, when the S3_TEST_* secrets exist,
# - the full Rust suite without retries, so flaky tests surface as failures.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-nightly:
    name: Backend (proptest x2000, no retries)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: nightly-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: nightly-${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Prepare dist
        run: mkdir -p dist

      - name: Full suite, high proptest case count
        env:
          PROPTEST_CASES: "2000"
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --locked --profile nightly

      - name: Live S3 round-trip (ignored tests)
        env:
          S3_TEST_AK: ${{ secrets.S3_TEST_AK }}
          S3_TEST_SK: ${{ secrets.S3_TEST_SK }}
          S3_TEST_REGION: ${{ secrets.S3_TEST_REGION }}
          S3_TEST_BUCKET: ${{ secrets.S3_TEST_BUCKET }}
          S3_TEST_ENDPOINT: ${{ secrets.S3_TEST_ENDPOINT }}
        shell: bash
        run: |
          if [ -z "$S3_TEST_ENDPOINT" ]; then
            echo "::notice::S3_TEST_* secrets not configured; skipping live S3 tests"
            exit 0
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::s3 -- --ignored

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-junit
          path: src-tauri/target/nextest/nightly/junit.xml
          if-no-files-found: ignore
          retention-days: 30
