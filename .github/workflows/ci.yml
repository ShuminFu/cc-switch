name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by release.yml so a tag is only released after CI passes on its SHA.
  workflow_call:

# Least-privilege GITHUB_TOKEN: CI only reads the repo. Without this the token
# falls back to the repository default, which may be write-all (CCS-027).
# release.yml calls this workflow with the same contents: read grant.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # package.json / Cargo.toml / tauri.conf.json must agree and have a
      # CHANGELOG entry; on a tag (release.yml calls this workflow) the tag
      # must match too (CCS-033).
      - name: Check version consistency
        run: node scripts/check-versions.mjs

      # The AppStream metainfo <releases> block is generated from CHANGELOG.md
      # and must list the package.json version (CCS-044).
      - name: Check AppStream metainfo releases
        run: node scripts/sync-metainfo-releases.mjs --check

      # Tauri commands are thin adapters: a body over 40 lines or a direct
      # database query fails, and every command returns IpcError (CCS-181).
      - name: Check thin command bodies
        run: node scripts/check-command-bodies.mjs

      - name: Check IpcError coverage
        run: node scripts/count-ipc-error-commands.mjs --min 100

      - name: Unit tests
        run: pnpm test:unit

      # Typecheck accepts any `*.css` / asset import, so only a real vite build
      # catches unresolved imports and rollup errors before a release tag (CCS-024).
      - name: Production build
        run: pnpm build:renderer

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # rust-toolchain.toml is the single source for the channel and the
      # rustfmt/clippy components (CCS-025).
      - name: Setup Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      # rust-cache keys on Cargo.lock, the toolchain and the job, and prunes
      # workspace crates before saving so the cache stays small (CCS-033).
      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # src/shared/bindings.ts is generated from the Rust DTOs and the command
      # registry in src-tauri/src/commands/registry.rs (CCS-117, CCS-180).
      # Regenerate it and fail with a diff when the committed file is stale.
      - name: Check generated bindings
        if: runner.os == 'Linux'
        shell: bash
        env:
          UPDATE_BINDINGS: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib bindings
          if ! git diff --exit-code -- src/shared/bindings.ts; then
            echo "::error file=src/shared/bindings.ts::stale generated bindings; run 'UPDATE_BINDINGS=1 cargo test --lib bindings' in src-tauri and commit the result"
            exit 1
          fi
          # build.rs regenerates the ACL permission sets from
          # src-tauri/src/commands/registry.rs (CCS-180).
          # `git status` also catches a new domain whose set was never committed.
          if [ -n "$(git status --porcelain -- src-tauri/permissions)" ]; then
            git status --porcelain -- src-tauri/permissions
            git diff -- src-tauri/permissions
            echo "::error file=src-tauri/permissions::stale command permission sets; rebuild src-tauri and commit src-tauri/permissions/*.toml"
            exit 1
          fi

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # tests/proxy_e2e.rs::perf_baseline_non_streaming_request writes its
      # per-OS measurement to CARGO_TARGET_TMPDIR (CCS-014); keep it even when
      # a test fails so the numbers can be compared across the matrix (CCS-213).
      - name: Upload proxy e2e perf artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-e2e-perf-${{ matrix.os }}
          path: src-tauri/target/tmp/proxy-e2e-perf.json
          if-no-files-found: warn

  # Proves the declared rust-version in src-tauri/Cargo.toml is real: the
  # lockfile must still build on the MSRV, not only on the pinned channel
  # (CCS-025). Keep the version here in sync with `rust-version`.
  msrv:
    name: MSRV Check (Rust 1.88)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust
        run: rustup toolchain install 1.88 --profile minimal

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: msrv

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Cargo check on MSRV
        working-directory: src-tauri
        run: cargo +1.88 check --locked

  # Builds the real app binary against the real dist (beforeBuildCommand runs
  # build:renderer), so tauri config / frontendDist / build-script failures
  # surface on PRs instead of only on release tags (CCS-024). --no-bundle skips
  # packaging and updater signing, so no secrets are needed.
  tauri-build-smoke:
    name: Tauri Build Smoke (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # rust-toolchain.toml pins the channel.
      - name: Setup Rust
        run: rustup toolchain install

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: tauri-smoke

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri debug build (no bundle)
        run: pnpm tauri build --debug --no-bundle

      - name: Verify binary and dist
        shell: bash
        run: |
          test -f dist/index.html
          test -x src-tauri/target/debug/cc-switch

      # E2E smoke (CCS-201): drive the debug binary through tauri-driver +
      # WebdriverIO under xvfb: first run, add a preset, switch providers and
      # check ~/.claude/settings.json, proxy takeover on and restore. The app
      # runs with a temp HOME. release.yml runs the same spec on the AppImage.
      - name: Install E2E system deps
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked

      - name: Install E2E dependencies
        run: pnpm install --dir e2e --frozen-lockfile --ignore-workspace

      - name: E2E smoke (debug build)
        timeout-minutes: 10
        run: xvfb-run -a pnpm --dir e2e test

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-debug
          path: e2e/artifacts/
          if-no-files-found: ignore

  # Report-only coverage (CCS-019): never blocks a PR. Thresholds are ratcheted
  # in P5 (target: 75% lines for proxy/ and database/). Baseline numbers live in
  # docs/dev/perf-baseline.json.
  coverage-frontend:
    name: Coverage (frontend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Per-directory summary
        if: always() && hashFiles('coverage/frontend/lcov.info') != ''
        run: |
          node scripts/coverage-summary.mjs --title "Frontend (vitest)" \
            --lcov coverage/frontend/lcov.info \
            --dir src/components --dir src/hooks --dir src/lib \
            --json coverage/frontend/summary-by-dir.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/frontend/
          if-no-files-found: warn
          retention-days: 30

  coverage-rust:
    name: Coverage (Rust)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # rust-toolchain.toml pins the channel; install it and add llvm-tools,
      # which cargo-llvm-cov needs but the toolchain file does not list.
      - name: Setup Rust
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: llvm-cov

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist coverage/rust

      # --no-fail-fast still writes the report when a test fails; the job is
      # report-only, so test failures are gated by the backend job instead.
      - name: Tests with coverage
        run: >-
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --no-fail-fast
          --lcov --output-path coverage/rust/lcov.info

      - name: Per-directory summary
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        run: |
          node scripts/coverage-summary.mjs --title "Rust (cargo-llvm-cov)" \
            --lcov coverage/rust/lcov.info \
            --dir src-tauri/src/proxy --dir src-tauri/src/database \
            --dir src-tauri/src/services --dir src-tauri/src/commands \
            --json coverage/rust/summary-by-dir.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage/rust/
          if-no-files-found: warn
          retention-days: 30
