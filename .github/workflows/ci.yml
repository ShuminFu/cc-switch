name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by release.yml so every release commit passes CI first.
  workflow_call:
  schedule:
    # Weekly run so new RustSec / npm advisories surface without code changes.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Every job only reads the repository (CI-18).
permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when invoked via workflow_call, so a
  # release run never shares (and cancels) a group with a regular CI run.
  # PRs are grouped by number and superseded pushes are cancelled; every other
  # event (push to main, schedule, release) is grouped by commit, so two quick
  # merges to main both finish with a result (CI-18).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Toolchain versions come from the repository, not from this file:
#   Node  -> .node-version
#   pnpm  -> package.json "packageManager"
#   Rust  -> rust-toolchain.toml

jobs:
  # TEST-23: warn (not fail) when a `fix` PR touches no test file.
  regression-test-hint:
    name: Regression test hint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Warn on fix PRs without tests
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$PR_TITLE" in
            fix*|Fix*) ;;
            *) echo "Not a fix PR; nothing to check."; exit 0 ;;
          esac
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$changed" | grep -Eq '(^tests/|^e2e/|^src-tauri/tests/|\.test\.tsx?$|/tests?\.rs$|_tests?\.rs$)' \
            || git diff "$BASE_SHA"...HEAD -- 'src-tauri/src/**.rs' | grep -Eq '^\+\s*#\[(tokio::)?test'; then
            echo "Fix PR includes test changes."
          else
            echo "::warning title=No regression test::This fix PR changes no test file. Add a regression test or explain why in the PR description (see the PR template)."
          fi

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      # package.json, Cargo.toml, Cargo.lock and tauri.conf.json must carry the
      # same version; on a v* tag (release.yml calls this workflow first) the
      # tag must match it too, so a mismatched tag fails before any build.
      - name: Check version consistency
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/bump-version.mjs --check --tag "$GITHUB_REF_NAME"
          else
            node scripts/bump-version.mjs --check
          fi

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check i18n locale integrity
        run: pnpm i18n:check

      # Labeler globs must match tracked files, README/manual asset names must
      # match what release.yml publishes, and the four READMEs must keep the
      # same section structure (CI-28, CI-31, DOCS-11, DOCS-30).
      - name: Repository docs and governance checks
        run: pnpm check:repo

      - name: Unit tests (coverage + JUnit report)
        run: pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        with:
          report_paths: reports/vitest-junit.xml
          check_name: Frontend unit tests
          annotate_only: true
          detailed_summary: true
          include_passed: false

      # Non-blocking: the coverage upload must never fail CI (CI-16, CI-26).
      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 14

      # TEST-17: renderer journeys in Chromium against a mocked Tauri IPC.
      # Playwright is not a project dependency; install the pinned CLI here.
      - name: Install Playwright (Chromium)
        run: |
          npm i -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium

      - name: E2E journeys (Playwright)
        run: NODE_PATH="$(npm root -g)" pnpm test:e2e

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build renderer bundle
        run: pnpm build:renderer

      # Size report of the shipped JS/CSS in the job summary, failing only
      # when a budget in scripts/bundle-report.mjs is exceeded (PERF-29, PERF-30).
      - name: Renderer bundle size report
        run: node scripts/bundle-report.mjs --summary "$GITHUB_STEP_SUMMARY" --json reports/bundle-size.json

      - name: Upload renderer bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload bundle size report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size
          path: reports/bundle-size.json
          if-no-files-found: ignore
          retention-days: 30

  backend:
    name: Backend Checks
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the release.yml build images.
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      # Keyed on toolchain + Cargo.lock + job, pruned of workspace artifacts
      # before saving, so the three OSes do not thrash the cache (CI-12).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Download renderer bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renderer-dist
          path: dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      # --all-targets lints unit/integration tests too; --all-features covers
      # the `test-hooks` feature (CI-45). --locked fails on a stale Cargo.lock.
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check generated IPC bindings are up to date (src/lib/bindings.ts)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::bindings

      # cargo-nextest is not used yet: ~140 `#[serial]` tests rely on in-process
      # serialisation and some share fixed temp paths, which nextest's
      # process-per-test model would race. Audit those first.
      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # Compile (and on Linux, test) the ARM64 targets that release.yml ships, so
  # an aarch64-only break fails before a tag is pushed (CI-25).
  backend-arm64:
    name: Backend Checks (ARM64)
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      # rquickjs needs bindgen (libclang) on aarch64-pc-windows-msvc; same step
      # as the release leg.
      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = Join-Path 'C:\Program Files\LLVM' 'bin'
          if (-not (Test-Path $llvmBin)) { throw "LLVM not found at $llvmBin" }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Download renderer bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renderer-dist
          path: dist

      - name: Run tests (Linux ARM64)
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check all targets (Windows ARM64)
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

  supply-chain:
    name: Supply Chain (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: cargo-deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check bans licenses sources

      # Report-only until the existing advisories are triaged; flip
      # continue-on-error to false once the baseline is clean.
      - name: cargo-deny (RustSec advisories)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          install: "false"

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level=high
