name: PR Title and Size

# Enforces the Conventional Commit format CONTRIBUTING.md asks for on the PR
# title (which becomes the squash-merge subject) and labels PRs by size
# (CI-34). The size label is informational: CONTRIBUTING.md asks for small,
# focused PRs, but nothing is blocked on size.
#
# SECURITY: `pull_request_target` runs with a base-repository token for fork
# PRs. Neither job checks out or runs code from the PR; both only read PR
# metadata through the API. Never add actions/checkout here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # "feat(provider): Add X" is fine, "feat(provider): add X." too; only
          # the type prefix is enforced.
          subjectPattern: ^.+$

  size:
    name: Size label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/XS"
          xs_max_size: "10"
          s_label: "size/S"
          s_max_size: "100"
          m_label: "size/M"
          m_max_size: "500"
          l_label: "size/L"
          l_max_size: "1000"
          xl_label: "size/XL"
          fail_if_xl: "false"
          message_if_xl: >
            This PR changes more than 1000 lines. Please consider splitting it into smaller,
            focused PRs (see CONTRIBUTING.md). Generated files and lockfiles count too.
          files_to_ignore: |
            pnpm-lock.yaml
            src-tauri/Cargo.lock
            src/lib/bindings.ts
            docs/roadmap/*
