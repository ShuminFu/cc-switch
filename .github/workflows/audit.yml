name: Dependency Audit

# Fails when a dependency has a known security advisory. Runs on every PR and
# push, and weekly so that advisories published against unchanged lockfiles
# still surface.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Config: src-tauri/deny.toml (advisories, licenses, bans, sources).
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      # Reads pnpm-lock.yaml; accepted advisories live in
      # pnpm-workspace.yaml under auditConfig.ignoreGhsas.
      - name: pnpm audit
        run: pnpm audit --audit-level=high
