name: Close Stale Issues

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      debug-only:
        description: 'Dry run: log what would be labelled / marked stale / closed without changing anything'
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    env:
      # Manual dry runs pass debug-only: true; scheduled runs have no inputs and act for real
      DEBUG_ONLY: ${{ inputs.debug-only == true }}
      POPULAR_LABEL: 'popular'
      POPULAR_MIN_REACTIONS: '3'
    steps:
      # actions/stale has no reaction-based exemption, so open issues with 3+ reactions
      # get the `popular` label first and are then skipped via exempt-issue-labels
      - name: Label popular issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const label = process.env.POPULAR_LABEL;
            const minReactions = Number(process.env.POPULAR_MIN_REACTIONS);
            const dryRun = process.env.DEBUG_ONLY === 'true';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            let labelled = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if ((issue.reactions?.total_count ?? 0) < minReactions) continue;
              const names = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
              if (names.includes(label)) continue;
              core.info(`${dryRun ? '[dry run] would label' : 'Labelling'} #${issue.number} as ${label} (${issue.reactions.total_count} reactions)`);
              if (!dryRun) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: [label],
                });
              }
              labelled++;
            }
            core.info(`${labelled} issue(s) newly labelled ${label}`);

      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          # --- Timing ---
          days-before-stale: 60
          days-before-close: 14

          # --- Stale label ---
          stale-issue-label: 'stale'

          # --- Messages (bilingual) ---
          stale-issue-message: |
            此 issue 已超过 60 天没有活动，已被标记为 `stale`。
            如果此问题仍然存在，请回复以保持 issue 打开状态，否则将在 14 天后自动关闭。

            This issue has been automatically marked as `stale` because it has not had activity for 60 days.
            Please reply to keep it open, otherwise it will be automatically closed in 14 days.
          close-issue-message: |
            此 issue 因长时间无活动已被自动关闭。如果问题仍然存在，欢迎重新打开。

            This issue has been automatically closed due to inactivity. If the problem persists, feel free to reopen it.

          # --- Exemptions ---
          # Issues with these labels will NEVER be marked stale
          # (`popular` is applied by the previous step to issues with 3+ reactions)
          exempt-issue-labels: 'security,performance,popular'

          # --- Dry run (workflow_dispatch input) ---
          debug-only: ${{ env.DEBUG_ONLY }}

          # --- Processing limits ---
          # Process up to 100 issues per run to avoid API rate limits
          operations-per-run: 100

          # --- Only issues, not PRs ---
          days-before-pr-stale: -1
          days-before-pr-close: -1
